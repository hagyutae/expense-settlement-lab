<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="stylesheet" href="swagger-ui.css">
<style>
:root{
  --ink:#16150F; --ink-2:#3A382F; --paper:#FBFAF7;
  --line:#E2DFD5; --accent:#C9603C; --accent-soft:#F6E9E2; --mute:#8A8779;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
header{
  background:var(--ink); color:var(--paper);
  padding:34px 32px 30px; border-bottom:6px solid var(--accent);
}
header .wrap{max-width:1100px;margin:0 auto;}
header .eyebrow{
  font-size:13px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
header h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:12px 0 0;}
header p{margin:14px 0 0;color:#B9B5A6;font-size:15px;line-height:1.65;}
header code{
  font-family:'SFMono-Regular',Menlo,Consolas,monospace;
  background:#2A2822; padding:2px 7px; border-radius:4px; font-size:.9em; color:#E6E2D6;
}

main{max-width:1100px;margin:0 auto;padding:0 32px 64px;}

.note{
  background:var(--accent-soft); border-left:5px solid var(--accent);
  padding:18px 24px; margin:28px 0 0; font-size:15px; line-height:1.65; color:#5E2E1B;
}
.note b{font-weight:700;}
.note code{
  font-family:'SFMono-Regular',Menlo,Consolas,monospace;
  background:#EBD9D0; padding:1px 6px; border-radius:4px; font-size:.9em;
}

/* Swagger UI 를 덱 톤에 맞춘다 */
#swagger-ui{margin-top:20px;}
.swagger-ui .topbar{display:none;}
.swagger-ui .info{margin:24px 0;}
.swagger-ui .info .title{font-size:24px;color:var(--ink);}
.swagger-ui .scheme-container{background:transparent;box-shadow:none;padding:0;}
.swagger-ui .opblock.opblock-post{
  border-color:var(--accent); background:var(--accent-soft);
}
.swagger-ui .opblock.opblock-post .opblock-summary-method{background:var(--accent);}
.swagger-ui .btn.execute{background:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="wrap">
        <h1>경비 정산 API</h1>
    <p>

      서버를 띄우면 <code>http://127.0.0.1:8000/docs</code> 에서 같은 화면을 직접 열 수 있습니다.
    </p>
  </div>
</header>

<main>

  <div id="swagger-ui"></div>
</main>
